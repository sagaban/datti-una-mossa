[build]
  # si un test falla (por ejemplo el candado de contenido) no se publica nada
  command = "pnpm test && pnpm build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# SPA: cualquier ruta sirve el shell (los archivos existentes se sirven primero)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# el service worker tiene que revalidarse siempre para que lleguen las actualizaciones
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
